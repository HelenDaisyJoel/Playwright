services:

  ncl_admin:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file:
      - playwright-automation/.env
    environment:
      BRAND: NCL
      ROLE: admin
    command: ["npx", "playwright", "test", "--grep", "@NCL-admin"]

  ncl_manager:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file:
      - playwright-automation/.env
    environment:
      BRAND: NCL
      ROLE: manager
    command: ["npx", "playwright", "test", "--grep", "@NCL-manager"]

  ncl_analyst:
