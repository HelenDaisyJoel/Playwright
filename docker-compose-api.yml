      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: OCEANIA
      ROLE: manager
    command: ["pytest", "-m", "OCEANIA_manager"]

  be_oceania_analyst:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: OCEANIA
      ROLE: analyst
    command: ["pytest", "-m", "OCEANIA_analyst"]

  be_regent_admin:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: REGENT
      ROLE: admin
    command: ["pytest", "-m", "REGENT_admin"]

  be_regent_manager:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: REGENT
      ROLE: manager
    command: ["pytest", "-m", "REGENT_manager"]

  be_regent_analyst:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: REGENT
      ROLE: analyst
    command: ["pytest", "-m", "REGENT_analyst"]

