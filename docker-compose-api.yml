services:
  be_ncl_admin:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: NCL
      ROLE: admin
    command: ["pytest", "-m", "NCL_admin"]

  be_ncl_manager:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: NCL
      ROLE: manager
    command: ["pytest", "-m", "NCL_manager"]

  be_ncl_analyst:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - pytest-automation/.env
    environment:
      BRAND: NCL
      ROLE: analyst
    command: ["pytest", "-m", "NCL_analyst"]

  be_oceania_admin:
